name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    env:
        STACK_SUFFIX: ${{ vars.STACK_SUFFIX }}
        CALLBACK_URL: ${{ vars.CALLBACK_URL }}
        LOGOUT_URL: ${{ vars.LOGOUT_URL }}
        CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
        DATABASE_MIN_CAPACITY: ${{ vars.DATABASE_MIN_CAPACITY }}
        DATABASE_MAX_CAPACITY: ${{ vars.DATABASE_MAX_CAPACITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Shared Stack
        run: |
          aws cloudformation deploy \
            --stack-name shared-${STACK_SUFFIX} \
            --template-file infra/shared/shared.yaml

      - name: Read Shared Stack Outputs
        run: |
          PRIVATE_SUBNET_IDS=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetIds'].OutputValue" \
            --output text)

          DATABASE_SECURITY_GROUP_ID=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseSecurityGroupId'].OutputValue" \
            --output text)

          LAMBDA_SECURITY_GROUP_ID=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_IDS}" >> "$GITHUB_ENV"
          echo "DATABASE_SECURITY_GROUP_ID=${DATABASE_SECURITY_GROUP_ID}" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP_ID}" >> "$GITHUB_ENV"

      - name: Deploy Database Stack
        run: |
          aws cloudformation deploy \
            --stack-name database-${STACK_SUFFIX} \
            --template-file infra/database/database.yaml \
            --parameter-overrides \
              StackSuffix="${STACK_SUFFIX}" \
              DatabaseMinCapacity="${DATABASE_MIN_CAPACITY:-0.5}" \
              DatabaseMaxCapacity="${DATABASE_MAX_CAPACITY:-1}" \
              PrivateSubnetIds="${PRIVATE_SUBNET_IDS}" \
              DatabaseSecurityGroupId="${DATABASE_SECURITY_GROUP_ID}"

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --stack-name auth-${STACK_SUFFIX} \
            --template-file infra/auth/auth.yaml \
            --parameter-overrides \
                StackSuffix="${STACK_SUFFIX}" \
                CallbackUrl="${CALLBACK_URL}" \
                LogoutUrl="${LOGOUT_URL}"

      - name: Read Auth Stack Outputs
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name auth-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)

          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name auth-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)

          echo "USER_POOL_ID=${USER_POOL_ID}" >> "$GITHUB_ENV"
          echo "USER_POOL_CLIENT_ID=${USER_POOL_CLIENT_ID}" >> "$GITHUB_ENV"

      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --stack-name api-${STACK_SUFFIX} \
            --template-file infra/api/api.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackSuffix="${STACK_SUFFIX}" \
              UserPoolId="${USER_POOL_ID}" \
              UserPoolClientId="${USER_POOL_CLIENT_ID}" \
              CorsAllowedOrigin="${CORS_ALLOWED_ORIGIN}" \
              PrivateSubnetIds="${PRIVATE_SUBNET_IDS}" \
              LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP_ID}"
