name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    env:
        AWS_REGION: ${{ vars.AWS_REGION }}
        STACK_SUFFIX: ${{ vars.STACK_SUFFIX }}
        CALLBACK_URL: ${{ vars.CALLBACK_URL }}
        LOGOUT_URL: ${{ vars.LOGOUT_URL }}
        CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
        DATABASE_MIN_CAPACITY: ${{ vars.DATABASE_MIN_CAPACITY }}
        DATABASE_MAX_CAPACITY: ${{ vars.DATABASE_MAX_CAPACITY }}
        ENABLE_FRONTEND_HOSTING: ${{ vars.ENABLE_FRONTEND_HOSTING }}
        ENABLE_DATABASE_BACKEND: ${{ vars.ENABLE_DATABASE_BACKEND }}
        SECRETS_MANAGER_ENDPOINT_MULTI_AZ: ${{ vars.SECRETS_MANAGER_ENDPOINT_MULTI_AZ }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Shared Stack
        run: |
          aws cloudformation deploy \
            --stack-name shared-${STACK_SUFFIX} \
            --template-file infra/shared/shared.yaml \
            --parameter-overrides \
              DatabaseBackendEnabled="${ENABLE_DATABASE_BACKEND}" \
              SecretsManagerEndpointMultiAz="${SECRETS_MANAGER_ENDPOINT_MULTI_AZ}"

      - name: Read Shared Stack Outputs
        run: |
          PRIVATE_SUBNET_IDS=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetIds'].OutputValue" \
            --output text)

          DATABASE_SECURITY_GROUP_ID=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseSecurityGroupId'].OutputValue" \
            --output text)

          LAMBDA_SECURITY_GROUP_ID=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name shared-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
            --output text)

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_IDS}" >> "$GITHUB_ENV"
          echo "DATABASE_SECURITY_GROUP_ID=${DATABASE_SECURITY_GROUP_ID}" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP_ID}" >> "$GITHUB_ENV"
          echo "ARTIFACT_BUCKET=${ARTIFACT_BUCKET}" >> "$GITHUB_ENV"

      - name: Deploy Frontend Stack
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          aws cloudformation deploy \
            --stack-name frontend-${STACK_SUFFIX} \
            --template-file infra/frontend/frontend.yaml \
            --parameter-overrides \
              StackSuffix="${STACK_SUFFIX}"

      - name: Read Frontend Stack Outputs
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          FRONTEND_BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name frontend-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)

          CLOUDFRONT_DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name frontend-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          FRONTEND_URL=$(aws cloudformation describe-stacks \
            --stack-name frontend-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)

          echo "FRONTEND_BUCKET_NAME=${FRONTEND_BUCKET_NAME}" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=${FRONTEND_URL}" >> "$GITHUB_ENV"

      - name: Configure Hosted Frontend Origins
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          if [ -z "${FRONTEND_URL}" ]; then
            echo "FrontendUrl output is required when frontend hosting is enabled."
            exit 1
          fi

          if [ "${{ inputs.environment }}" = "development" ]; then
            CALLBACK_URLS="http://localhost:3000/dashboard,${FRONTEND_URL}/dashboard"
            LOGOUT_URLS="http://localhost:3000,${FRONTEND_URL}"
            CORS_ALLOWED_ORIGINS="http://localhost:3000,${FRONTEND_URL}"
          else
            CALLBACK_URLS="${FRONTEND_URL}/dashboard"
            LOGOUT_URLS="${FRONTEND_URL}"
            CORS_ALLOWED_ORIGINS="${FRONTEND_URL}"
          fi

          echo "CALLBACK_URLS=${CALLBACK_URLS}" >> "$GITHUB_ENV"
          echo "LOGOUT_URLS=${LOGOUT_URLS}" >> "$GITHUB_ENV"
          echo "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" >> "$GITHUB_ENV"

      - name: Configure Backend Origins Without Frontend Hosting
        if: ${{ env.ENABLE_FRONTEND_HOSTING != 'true' }}
        run: |
          echo "CALLBACK_URLS=${CALLBACK_URL}" >> "$GITHUB_ENV"
          echo "LOGOUT_URLS=${LOGOUT_URL}" >> "$GITHUB_ENV"
          echo "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGIN}" >> "$GITHUB_ENV"

      - name: Verify Production Excludes Localhost
        if: ${{ inputs.environment == 'production' }}
        run: |
          if [[ "${CALLBACK_URLS},${LOGOUT_URLS},${CORS_ALLOWED_ORIGINS}" == *"http://localhost:3000"* ]]; then
            echo "Production callback, logout, and CORS configuration must exclude localhost."
            exit 1
          fi

      - name: Validate Hosted Frontend Dependencies
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          if [ "${ENABLE_DATABASE_BACKEND}" != "true" ]; then
            echo "Frontend hosting requires ENABLE_DATABASE_BACKEND=true so the API base URL can be supplied at build time."
            exit 1
          fi

      - name: Build Migration Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          MIGRATION_ARTIFACT_KEY="lambda/migrate/${GITHUB_SHA}.zip"
          MIGRATION_ARTIFACT_PATH="dist/lambda/migrate.zip"

          rm -rf dist/lambda/migrate "${MIGRATION_ARTIFACT_PATH}"
          mkdir -p dist/lambda/migrate
          python -m pip install --upgrade pip
          python -m pip install --target dist/lambda/migrate ./backend
          cp backend/alembic.ini dist/lambda/migrate/alembic.ini
          cp -R backend/migrations dist/lambda/migrate/migrations

          (cd dist/lambda/migrate && zip -r ../migrate.zip .)

          echo "MIGRATION_ARTIFACT_KEY=${MIGRATION_ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "MIGRATION_ARTIFACT_PATH=${MIGRATION_ARTIFACT_PATH}" >> "$GITHUB_ENV"

      - name: Upload Migration Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws s3 cp "${MIGRATION_ARTIFACT_PATH}" "s3://${ARTIFACT_BUCKET}/${MIGRATION_ARTIFACT_KEY}"

      - name: Deploy Database Stack
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws cloudformation deploy \
            --stack-name database-${STACK_SUFFIX} \
            --template-file infra/database/database.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackSuffix="${STACK_SUFFIX}" \
              DatabaseMinCapacity="${DATABASE_MIN_CAPACITY:-0}" \
              DatabaseMaxCapacity="${DATABASE_MAX_CAPACITY:-1}" \
              PrivateSubnetIds="${PRIVATE_SUBNET_IDS}" \
              DatabaseSecurityGroupId="${DATABASE_SECURITY_GROUP_ID}" \
              LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP_ID}" \
              MigrationFunctionCodeS3Bucket="${ARTIFACT_BUCKET}" \
              MigrationFunctionCodeS3Key="${MIGRATION_ARTIFACT_KEY}"

      - name: Read Database Stack Outputs
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          DATABASE_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name database-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text)

          DATABASE_PORT=$(aws cloudformation describe-stacks \
            --stack-name database-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePort'].OutputValue" \
            --output text)

          DATABASE_NAME=$(aws cloudformation describe-stacks \
            --stack-name database-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseName'].OutputValue" \
            --output text)

          DATABASE_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name database-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseSecretArn'].OutputValue" \
            --output text)

          MIGRATION_FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name database-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='MigrationFunctionName'].OutputValue" \
            --output text)

          echo "DATABASE_ENDPOINT=${DATABASE_ENDPOINT}" >> "$GITHUB_ENV"
          echo "DATABASE_PORT=${DATABASE_PORT}" >> "$GITHUB_ENV"
          echo "DATABASE_NAME=${DATABASE_NAME}" >> "$GITHUB_ENV"
          echo "DATABASE_SECRET_ARN=${DATABASE_SECRET_ARN}" >> "$GITHUB_ENV"
          echo "MIGRATION_FUNCTION_NAME=${MIGRATION_FUNCTION_NAME}" >> "$GITHUB_ENV"

      - name: Run Database Migrations
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws lambda invoke \
            --function-name "${MIGRATION_FUNCTION_NAME}" \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            /tmp/migration-response.json \
            > /tmp/migration-invoke.json

          cat /tmp/migration-response.json

          FUNCTION_ERROR=$(python -c "import json; print(json.load(open('/tmp/migration-invoke.json')).get('FunctionError', ''))")
          if [ -n "${FUNCTION_ERROR}" ]; then
            cat /tmp/migration-invoke.json
            exit 1
          fi

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --stack-name auth-${STACK_SUFFIX} \
            --template-file infra/auth/auth.yaml \
            --parameter-overrides \
                StackSuffix="${STACK_SUFFIX}" \
                CallbackUrls="${CALLBACK_URLS}" \
                LogoutUrls="${LOGOUT_URLS}"

      - name: Read Auth Stack Outputs
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name auth-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)

          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name auth-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)

          COGNITO_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name auth-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolDomain'].OutputValue" \
            --output text)

          echo "USER_POOL_ID=${USER_POOL_ID}" >> "$GITHUB_ENV"
          echo "USER_POOL_CLIENT_ID=${USER_POOL_CLIENT_ID}" >> "$GITHUB_ENV"
          echo "COGNITO_DOMAIN=${COGNITO_DOMAIN}" >> "$GITHUB_ENV"

      - name: Build Me Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          ME_ARTIFACT_KEY="lambda/me/${GITHUB_SHA}.zip"
          ME_ARTIFACT_PATH="dist/lambda/me.zip"

          rm -rf dist/lambda/me "${ME_ARTIFACT_PATH}"
          mkdir -p dist/lambda/me
          python -m pip install --upgrade pip
          python -m pip install --target dist/lambda/me ./backend

          (cd dist/lambda/me && zip -r ../me.zip .)

          echo "ME_ARTIFACT_KEY=${ME_ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "ME_ARTIFACT_PATH=${ME_ARTIFACT_PATH}" >> "$GITHUB_ENV"

      - name: Upload Me Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws s3 cp "${ME_ARTIFACT_PATH}" "s3://${ARTIFACT_BUCKET}/${ME_ARTIFACT_KEY}"

      - name: Build Goals Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          GOALS_ARTIFACT_KEY="lambda/goals/${GITHUB_SHA}.zip"
          GOALS_ARTIFACT_PATH="dist/lambda/goals.zip"

          rm -rf dist/lambda/goals "${GOALS_ARTIFACT_PATH}"
          mkdir -p dist/lambda/goals
          python -m pip install --upgrade pip
          python -m pip install --target dist/lambda/goals ./backend

          (cd dist/lambda/goals && zip -r ../goals.zip .)

          echo "GOALS_ARTIFACT_KEY=${GOALS_ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "GOALS_ARTIFACT_PATH=${GOALS_ARTIFACT_PATH}" >> "$GITHUB_ENV"

      - name: Upload Goals Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws s3 cp "${GOALS_ARTIFACT_PATH}" "s3://${ARTIFACT_BUCKET}/${GOALS_ARTIFACT_KEY}"

      - name: Build Content Sources Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          CONTENT_SOURCES_ARTIFACT_KEY="lambda/content-sources/${GITHUB_SHA}.zip"
          CONTENT_SOURCES_ARTIFACT_PATH="dist/lambda/content-sources.zip"

          rm -rf dist/lambda/content-sources "${CONTENT_SOURCES_ARTIFACT_PATH}"
          mkdir -p dist/lambda/content-sources
          python -m pip install --upgrade pip
          python -m pip install --target dist/lambda/content-sources ./backend

          (cd dist/lambda/content-sources && zip -r ../content-sources.zip .)

          echo "CONTENT_SOURCES_ARTIFACT_KEY=${CONTENT_SOURCES_ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "CONTENT_SOURCES_ARTIFACT_PATH=${CONTENT_SOURCES_ARTIFACT_PATH}" >> "$GITHUB_ENV"

      - name: Upload Content Sources Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws s3 cp "${CONTENT_SOURCES_ARTIFACT_PATH}" "s3://${ARTIFACT_BUCKET}/${CONTENT_SOURCES_ARTIFACT_KEY}"

      - name: Build Content Items Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          CONTENT_ITEMS_ARTIFACT_KEY="lambda/content-items/${GITHUB_SHA}.zip"
          CONTENT_ITEMS_ARTIFACT_PATH="dist/lambda/content-items.zip"

          rm -rf dist/lambda/content-items "${CONTENT_ITEMS_ARTIFACT_PATH}"
          mkdir -p dist/lambda/content-items
          python -m pip install --upgrade pip
          python -m pip install --target dist/lambda/content-items ./backend

          (cd dist/lambda/content-items && zip -r ../content-items.zip .)

          echo "CONTENT_ITEMS_ARTIFACT_KEY=${CONTENT_ITEMS_ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "CONTENT_ITEMS_ARTIFACT_PATH=${CONTENT_ITEMS_ARTIFACT_PATH}" >> "$GITHUB_ENV"

      - name: Upload Content Items Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws s3 cp "${CONTENT_ITEMS_ARTIFACT_PATH}" "s3://${ARTIFACT_BUCKET}/${CONTENT_ITEMS_ARTIFACT_KEY}"

      - name: Build Content Item Writer Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          CONTENT_ITEM_WRITER_ARTIFACT_KEY="lambda/content-item-writer/${GITHUB_SHA}.zip"
          CONTENT_ITEM_WRITER_ARTIFACT_PATH="dist/lambda/content-item-writer.zip"

          rm -rf dist/lambda/content-item-writer "${CONTENT_ITEM_WRITER_ARTIFACT_PATH}"
          mkdir -p dist/lambda/content-item-writer
          python -m pip install --upgrade pip
          python -m pip install --target dist/lambda/content-item-writer ./backend

          (cd dist/lambda/content-item-writer && zip -r ../content-item-writer.zip .)

          echo "CONTENT_ITEM_WRITER_ARTIFACT_KEY=${CONTENT_ITEM_WRITER_ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "CONTENT_ITEM_WRITER_ARTIFACT_PATH=${CONTENT_ITEM_WRITER_ARTIFACT_PATH}" >> "$GITHUB_ENV"

      - name: Upload Content Item Writer Lambda Artifact
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws s3 cp "${CONTENT_ITEM_WRITER_ARTIFACT_PATH}" "s3://${ARTIFACT_BUCKET}/${CONTENT_ITEM_WRITER_ARTIFACT_KEY}"

      - name: Deploy Ingestion Stack
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws cloudformation deploy \
            --stack-name ingestion-${STACK_SUFFIX} \
            --template-file infra/ingestion/ingestion.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackSuffix="${STACK_SUFFIX}" \
              PrivateSubnetIds="${PRIVATE_SUBNET_IDS}" \
              LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP_ID}" \
              DatabaseEndpoint="${DATABASE_ENDPOINT}" \
              DatabasePort="${DATABASE_PORT}" \
              DatabaseName="${DATABASE_NAME}" \
              DatabaseSecretArn="${DATABASE_SECRET_ARN}" \
              ContentItemWriterFunctionCodeS3Bucket="${ARTIFACT_BUCKET}" \
              ContentItemWriterFunctionCodeS3Key="${CONTENT_ITEM_WRITER_ARTIFACT_KEY}"

      - name: Deploy API Stack
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          aws cloudformation deploy \
            --stack-name api-${STACK_SUFFIX} \
            --template-file infra/api/api.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackSuffix="${STACK_SUFFIX}" \
              UserPoolId="${USER_POOL_ID}" \
              UserPoolClientId="${USER_POOL_CLIENT_ID}" \
              CorsAllowedOrigins="${CORS_ALLOWED_ORIGINS}" \
              PrivateSubnetIds="${PRIVATE_SUBNET_IDS}" \
              LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP_ID}" \
              DatabaseEndpoint="${DATABASE_ENDPOINT}" \
              DatabasePort="${DATABASE_PORT}" \
              DatabaseName="${DATABASE_NAME}" \
              DatabaseSecretArn="${DATABASE_SECRET_ARN}" \
              MeFunctionCodeS3Bucket="${ARTIFACT_BUCKET}" \
              MeFunctionCodeS3Key="${ME_ARTIFACT_KEY}" \
              GoalsFunctionCodeS3Bucket="${ARTIFACT_BUCKET}" \
              GoalsFunctionCodeS3Key="${GOALS_ARTIFACT_KEY}" \
              ContentSourcesFunctionCodeS3Bucket="${ARTIFACT_BUCKET}" \
              ContentSourcesFunctionCodeS3Key="${CONTENT_SOURCES_ARTIFACT_KEY}" \
              ContentItemsFunctionCodeS3Bucket="${ARTIFACT_BUCKET}" \
              ContentItemsFunctionCodeS3Key="${CONTENT_ITEMS_ARTIFACT_KEY}"

      - name: Read API Stack Outputs
        if: ${{ vars.ENABLE_DATABASE_BACKEND == 'true' }}
        run: |
          API_BASE_URL=$(aws cloudformation describe-stacks \
            --stack-name api-${STACK_SUFFIX} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)

          echo "API_BASE_URL=${API_BASE_URL}" >> "$GITHUB_ENV"

      - name: Configure Frontend Build Environment
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          required_values=(
            AWS_REGION
            USER_POOL_ID
            USER_POOL_CLIENT_ID
            COGNITO_DOMAIN
            FRONTEND_URL
            API_BASE_URL
          )

          for name in "${required_values[@]}"; do
            if [ -z "${!name}" ] || [ "${!name}" = "None" ]; then
              echo "Required deployment value ${name} could not be resolved for the frontend build."
              exit 1
            fi
          done

          echo "NEXT_PUBLIC_AWS_REGION=${AWS_REGION}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=${USER_POOL_ID}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=${USER_POOL_CLIENT_ID}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_DOMAIN=${COGNITO_DOMAIN}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_AUTH_REDIRECT_SIGN_IN=${FRONTEND_URL}/dashboard" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_AUTH_REDIRECT_SIGN_OUT=${FRONTEND_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}" >> "$GITHUB_ENV"

      - name: Set Up Node
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build Frontend Static Export
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          pnpm build

          if [ ! -d apps/web/out ]; then
            echo "Expected Next.js static export directory apps/web/out was not created."
            exit 1
          fi

      - name: Upload Frontend Static Export
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          aws s3 sync apps/web/out/ "s3://${FRONTEND_BUCKET_NAME}/" --delete

      - name: Invalidate Frontend CloudFront Distribution
        if: ${{ env.ENABLE_FRONTEND_HOSTING == 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*'
          echo "Frontend deployed: ${FRONTEND_URL}"
