on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-stack.yml
    with:
      environment: development
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-stack.yml
    with:
      environment: production
    secrets: inherit