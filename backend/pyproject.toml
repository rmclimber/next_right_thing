[project]
name = "nrt-backend"
version = "0.1.0"
description = "Python backend package for Next Right Thing."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "feedparser>=6.0,<7",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# Parse CloudFormation/workflow YAML in infrastructure regression tests only.
test = ["PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nrt_backend*"]
