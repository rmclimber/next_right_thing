[project]
name = "nrt-backend"
version = "0.1.0"
description = "Python backend package for Next Right Thing."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nrt_backend*"]
