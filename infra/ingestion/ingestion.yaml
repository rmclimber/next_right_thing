AWSTemplateFormatVersion: '2010-09-09'
Description: Durable Content Item ingestion resources for Next Right Thing.

Parameters:
  ProjectName:
    Type: String
    Default: nrt
    Description: Short project identifier.

  StackSuffix:
    Type: String

  DatabaseEndpoint:
    Type: String
    Description: Aurora PostgreSQL writer endpoint.

  DatabaseClusterArn:
    Type: String
    Description: Aurora PostgreSQL cluster ARN for RDS Data API statements.

  DatabasePort:
    Type: Number
    Description: Aurora PostgreSQL port.

  DatabaseName:
    Type: String
    Description: Aurora PostgreSQL database name.

  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN containing database credentials.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for VPC-attached Lambda functions.

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for VPC-attached Lambda functions.

  ContentItemWriterFunctionCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Content Item Writer deployment package.

  ContentItemWriterFunctionCodeS3Key:
    Type: String
    Description: S3 key for the Content Item Writer deployment package.

  SourceDispatchFunctionCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Source Dispatch deployment package.

  SourceDispatchFunctionCodeS3Key:
    Type: String
    Description: S3 key for the Source Dispatch deployment package.

  RssFetchFunctionCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the RSS Fetch deployment package.

  RssFetchFunctionCodeS3Key:
    Type: String
    Description: S3 key for the RSS Fetch deployment package.

  EmbeddingRefreshFunctionCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the embedding refresh deployment package.

  EmbeddingRefreshFunctionCodeS3Key:
    Type: String
    Description: S3 key for the embedding refresh deployment package.

  EnableEmbeddingRefresh:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable the two-hour automatic embedding refresh schedule.

  EmbeddingRefreshMaxEmbeddings:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: Maximum new or stale subjects sent to Bedrock per invocation.

  ReserveEmbeddingRefreshConcurrency:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Reserve and cap refresh concurrency at one only when the account has reservation headroom.

Conditions:
  EmbeddingRefreshEnabled: !Equals [!Ref EnableEmbeddingRefresh, 'true']
  EmbeddingRefreshConcurrencyReserved: !Equals [!Ref ReserveEmbeddingRefreshConcurrency, 'true']

Resources:
  NormalizedContentItemsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${StackSuffix}-normalized-content-items"
      VisibilityTimeout: 180

  RssFetchJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${StackSuffix}-rss-fetch-jobs"
      VisibilityTimeout: 180

  SourceDispatchFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${StackSuffix}-source-dispatch-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: DataApiReadActiveRssSources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref DatabaseClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
        - PolicyName: FetchJobsSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RssFetchJobsQueue.Arn

  SourceDispatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${StackSuffix}-source-dispatch"
      Runtime: python3.12
      Handler: nrt_backend.lambdas.source_dispatch.handler.handler
      Timeout: 60
      Role: !GetAtt SourceDispatchFunctionRole.Arn
      Environment:
        Variables:
          DATABASE_CLUSTER_ARN: !Ref DatabaseClusterArn
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !Ref DatabaseSecretArn
          FETCH_JOBS_QUEUE_URL: !Ref RssFetchJobsQueue
      Code:
        S3Bucket: !Ref SourceDispatchFunctionCodeS3Bucket
        S3Key: !Ref SourceDispatchFunctionCodeS3Key

  SourceDispatchSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${StackSuffix}-source-dispatch"
      Description: Periodically dispatches active RSS Content Sources.
      ScheduleExpression: rate(120 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SourceDispatchFunction.Arn
          Id: SourceDispatch

  SourceDispatchSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SourceDispatchFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SourceDispatchSchedule.Arn

  RssFetchFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${StackSuffix}-rss-fetch-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: FetchJobsConsume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RssFetchJobsQueue.Arn
        - PolicyName: NormalizedContentItemsSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt NormalizedContentItemsQueue.Arn
        - PolicyName: SourceHealthDataApiWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref DatabaseClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn

  RssFetchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${StackSuffix}-rss-fetch"
      Runtime: python3.12
      Handler: nrt_backend.lambdas.rss_fetch.handler.handler
      Timeout: 60
      Role: !GetAtt RssFetchFunctionRole.Arn
      Environment:
        Variables:
          NORMALIZED_CONTENT_ITEMS_QUEUE_URL: !Ref NormalizedContentItemsQueue
          DATABASE_CLUSTER_ARN: !Ref DatabaseClusterArn
          DB_SECRET_ARN: !Ref DatabaseSecretArn
          DB_NAME: !Ref DatabaseName
      Code:
        S3Bucket: !Ref RssFetchFunctionCodeS3Bucket
        S3Key: !Ref RssFetchFunctionCodeS3Key

  RssFetchEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RssFetchJobsQueue.Arn
      FunctionName: !Ref RssFetchFunction
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ContentItemWriterFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${StackSuffix}-content-item-writer-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: LambdaVpcNetworking
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
        - PolicyName: DatabaseSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
        - PolicyName: NormalizedContentItemsConsume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt NormalizedContentItemsQueue.Arn

  ContentItemWriterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${StackSuffix}-content-item-writer"
      Runtime: python3.12
      Handler: nrt_backend.lambdas.content_item_writer.handler.handler
      Timeout: 60
      Role: !GetAtt ContentItemWriterFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseEndpoint
          DB_PORT: !Ref DatabasePort
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !Ref DatabaseSecretArn
      Code:
        S3Bucket: !Ref ContentItemWriterFunctionCodeS3Bucket
        S3Key: !Ref ContentItemWriterFunctionCodeS3Key

  ContentItemWriterEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt NormalizedContentItemsQueue.Arn
      FunctionName: !Ref ContentItemWriterFunction
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 2

  EmbeddingRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${StackSuffix}-embedding-refresh"
      RetentionInDays: 14

  EmbeddingRefreshFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EmbeddingRefresh
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt EmbeddingRefreshLogGroup.Arn
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !Ref DatabaseClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"

  EmbeddingRefreshFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${StackSuffix}-embedding-refresh"
      Runtime: python3.12
      Handler: nrt_backend.lambdas.embedding_refresh.handler.handler
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: !If [EmbeddingRefreshConcurrencyReserved, 1, !Ref AWS::NoValue]
      Role: !GetAtt EmbeddingRefreshFunctionRole.Arn
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Environment:
        Variables:
          DATABASE_CLUSTER_ARN: !Ref DatabaseClusterArn
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !Ref DatabaseSecretArn
          EMBEDDING_REFRESH_MAX_EMBEDDINGS: !Ref EmbeddingRefreshMaxEmbeddings
      Code:
        S3Bucket: !Ref EmbeddingRefreshFunctionCodeS3Bucket
        S3Key: !Ref EmbeddingRefreshFunctionCodeS3Key

  EmbeddingRefreshRetryConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref EmbeddingRefreshFunction
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2

  EmbeddingRefreshScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
      Policies:
        - PolicyName: InvokeEmbeddingRefresh
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EmbeddingRefreshFunction.Arn

  EmbeddingRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn: EmbeddingRefreshRetryConfig
    Properties:
      Name: !Sub "${ProjectName}-${StackSuffix}-embedding-refresh"
      Description: Refresh missing or stale Content Item and active Goal embeddings.
      ScheduleExpression: rate(2 hours)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: !If [EmbeddingRefreshEnabled, ENABLED, DISABLED]
      Target:
        Arn: !GetAtt EmbeddingRefreshFunction.Arn
        RoleArn: !GetAtt EmbeddingRefreshScheduleRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

  EmbeddingRefreshErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Embedding refresh failed or exceeded its bounded sweep budget; inspect the summary log.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmbeddingRefreshFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  EmbeddingRefreshFunctionName:
    Description: Non-VPC Lambda that refreshes semantic embedding caches.
    Value: !Ref EmbeddingRefreshFunction

  EmbeddingRefreshScheduleName:
    Description: Two-hour embedding refresh schedule; disabling it leaves manual invocation available.
    Value: !Ref EmbeddingRefreshSchedule

  NormalizedContentItemsQueueUrl:
    Description: URL for normalized Content Item messages.
    Value: !Ref NormalizedContentItemsQueue
    Export:
      Name: !Sub "${AWS::StackName}-NormalizedContentItemsQueueUrl"

  NormalizedContentItemsQueueArn:
    Description: ARN for normalized Content Item messages.
    Value: !GetAtt NormalizedContentItemsQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-NormalizedContentItemsQueueArn"

  ContentItemWriterFunctionName:
    Description: Content Item Writer Lambda function name.
    Value: !Ref ContentItemWriterFunction
    Export:
      Name: !Sub "${AWS::StackName}-ContentItemWriterFunctionName"

  SourceDispatchFunctionName:
    Description: Lambda that dispatches active RSS Content Sources.
    Value: !Ref SourceDispatchFunction
    Export:
      Name: !Sub "${AWS::StackName}-SourceDispatchFunctionName"

  RssFetchJobsQueueUrl:
    Description: URL for RSS fetch jobs.
    Value: !Ref RssFetchJobsQueue
    Export:
      Name: !Sub "${AWS::StackName}-RssFetchJobsQueueUrl"
