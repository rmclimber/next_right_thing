AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap GitHub Actions deployment role

Parameters:

  GitHubOrg:
    Type: String

  GitHubRepo:
    Type: String

Resources:

  GitHubDeploymentRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: NRTGitHubDeploymentRole

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Federated:
                !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com

            Action:
              - sts:AssumeRoleWithWebIdentity

            Condition:

              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com

              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:

  NRTDeploymentRoleArn:

    Value: !GetAtt NRTGitHubDeploymentRole.Arn