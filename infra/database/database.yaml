AWSTemplateFormatVersion: '2010-09-09'

Description: Database infrastructure for Next Right Thing.

Parameters:
  ProjectName:
    Type: String
    Default: nrt
    Description: Short project identifier.

  StackSuffix:
    Type: String

  DatabaseName:
    Type: String
    Default: nrt
    Description: Initial Aurora PostgreSQL database name.

  DatabaseMinCapacity:
    Type: Number
    Default: 0
    Description: Minimum Aurora Serverless v2 capacity units.

  DatabaseMaxCapacity:
    Type: Number
    Default: 1
    Description: Maximum Aurora Serverless v2 capacity units.

  DatabaseDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether deletion protection is enabled on the Aurora PostgreSQL cluster.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs from the shared stack.

  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Database security group ID from the shared stack.

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for VPC-attached Lambda functions.

  MigrationFunctionCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the migration Lambda deployment package.

  MigrationFunctionCodeS3Key:
    Type: String
    Description: S3 key for the migration Lambda deployment package.

Conditions:
  DatabaseDeletionProtectionEnabled: !Equals
    - !Ref DatabaseDeletionProtection
    - 'true'

Resources:
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName}-${StackSuffix} database private subnets"
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${StackSuffix}-database-subnets"

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-${StackSuffix}-database"
      Engine: aurora-postgresql
      EngineMode: provisioned
      DatabaseName: !Ref DatabaseName
      MasterUsername: nrt_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroupId
      Port: 5432
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DatabaseMinCapacity
        MaxCapacity: !Ref DatabaseMaxCapacity
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: !If
        - DatabaseDeletionProtectionEnabled
        - true
        - false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${StackSuffix}-database"

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceIdentifier: !Sub "${ProjectName}-${StackSuffix}-database-1"
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${StackSuffix}-database-1"

  MigrationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${StackSuffix}-database-migration-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: LambdaVpcNetworking
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
        - PolicyName: DatabaseSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn

  MigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${StackSuffix}-database-migrate"
      Runtime: python3.12
      Handler: nrt_backend.lambdas.migrate.handler.handler
      Timeout: 300
      Role: !GetAtt MigrationFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt DatabaseCluster.Endpoint.Address
          DB_PORT: !GetAtt DatabaseCluster.Endpoint.Port
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
      Code:
        S3Bucket: !Ref MigrationFunctionCodeS3Bucket
        S3Key: !Ref MigrationFunctionCodeS3Key

Outputs:
  DatabaseClusterArn:
    Description: Aurora PostgreSQL cluster ARN.
    Value: !GetAtt DatabaseCluster.DBClusterArn
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseClusterArn"

  DatabaseClusterIdentifier:
    Description: Aurora PostgreSQL cluster identifier.
    Value: !Ref DatabaseCluster
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseClusterIdentifier"

  DatabaseEndpoint:
    Description: Aurora PostgreSQL writer endpoint.
    Value: !GetAtt DatabaseCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseEndpoint"

  DatabaseReaderEndpoint:
    Description: Aurora PostgreSQL reader endpoint.
    Value: !GetAtt DatabaseCluster.ReadEndpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseReaderEndpoint"

  DatabasePort:
    Description: Aurora PostgreSQL port.
    Value: !GetAtt DatabaseCluster.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-DatabasePort"

  DatabaseName:
    Description: Initial database name.
    Value: !Ref DatabaseName
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseName"

  DatabaseSecretArn:
    Description: Secrets Manager ARN for the generated database credentials.
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseSecretArn"

  MigrationFunctionName:
    Description: Lambda function that applies Alembic migrations.
    Value: !Ref MigrationFunction
    Export:
      Name: !Sub "${AWS::StackName}-MigrationFunctionName"
