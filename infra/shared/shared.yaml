AWSTemplateFormatVersion: '2010-09-09'

Description: Shared infrastructure

Parameters:
  DatabaseBackendEnabled:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether database-backed application infrastructure is enabled for this environment.

Conditions:
  DatabaseBackendEnabledCondition: !Equals
    - !Ref DatabaseBackendEnabled
    - 'true'

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/20
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-1"

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.16.0/20
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-2"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private"

  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetOne
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetTwo
      RouteTableId: !Ref PrivateRouteTable

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database access security group
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database"

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda database access security group
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-lambda"
  
  DatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  SecretsManagerEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DatabaseBackendEnabledCondition
    Properties:
      GroupDescription: Secrets Manager endpoint access
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-secretsmanager-endpoint-sg"

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: DatabaseBackendEnabledCondition
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      SubnetIds:
        - !Ref PrivateSubnetOne
        - !Ref PrivateSubnetTwo
      SecurityGroupIds:
        - !Ref SecretsManagerEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-secretsmanager-endpoint"

Outputs:

  ArtifactBucketName:
    Value: !Ref ArtifactBucket

  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PrivateSubnetOneId:
    Value: !Ref PrivateSubnetOne
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetOneId"

  PrivateSubnetTwoId:
    Value: !Ref PrivateSubnetTwo
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetTwoId"

  PrivateSubnetIds:
    Value: !Join
      - ','
      - - !Ref PrivateSubnetOne
        - !Ref PrivateSubnetTwo
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseSecurityGroupId"

  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-LambdaSecurityGroupId"
