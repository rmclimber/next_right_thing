AWSTemplateFormatVersion: '2010-09-09'
Description: API resources for Next Right Thing.

Parameters:
  ProjectName:
    Type: String
    Default: nrt
    Description: Short project identifier.

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID used to validate JWTs.

  UserPoolClientId:
    Type: String
    Description: Cognito User Pool app client ID used as the JWT audience.

  CorsAllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Origin allowed to call the API from a browser.

Resources:
  MeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-api-me-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  MeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api-me"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MeFunctionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3

          cognito = boto3.client("cognito-idp")

          def access_token_from(event):
              header = event.get("headers", {}).get("authorization", "")
              prefix = "Bearer "

              if header.startswith(prefix):
                  return header[len(prefix):]

              return header

          def handler(event, context):
              claims = (
                  event
                  .get("requestContext", {})
                  .get("authorizer", {})
                  .get("jwt", {})
                  .get("claims", {})
              )
              access_token = access_token_from(event)
              attributes = {}

              if access_token:
                  user = cognito.get_user(AccessToken=access_token)
                  attributes = {
                      attribute["Name"]: attribute["Value"]
                      for attribute in user.get("UserAttributes", [])
                  }

              body = {
                  "sub": claims.get("sub"),
                  "email": attributes.get("email"),
                  "email_verified": attributes.get("email_verified"),
              }

              return {
                  "statusCode": 200,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps(body),
              }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - OPTIONS
        AllowOrigins:
          - !Ref CorsAllowedOrigin

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      Name: !Sub "${ProjectName}-api-cognito-jwt"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClientId
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"

  MeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt MeFunction.Arn
      PayloadFormatVersion: '2.0'

  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /me
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - aws.cognito.signin.user.admin
      Target: !Sub "integrations/${MeIntegration}"

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  MeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/me"

Outputs:
  ApiEndpoint:
    Description: Base URL for the authenticated HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint

  MeEndpoint:
    Description: Authenticated endpoint that returns selected JWT claims.
    Value: !Sub "${HttpApi.ApiEndpoint}/me"
