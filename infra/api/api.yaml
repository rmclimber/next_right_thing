AWSTemplateFormatVersion: '2010-09-09'
Description: API resources for Next Right Thing.

Parameters:
  ProjectName:
    Type: String
    Default: nrt
    Description: Short project identifier.

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID used to validate JWTs.

  UserPoolClientId:
    Type: String
    Description: Cognito User Pool app client ID used as the JWT audience.

  CorsAllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Origin allowed to call the API from a browser.

  DatabaseEndpoint:
    Type: String
    Description: Aurora PostgreSQL writer endpoint.

  DatabasePort:
    Type: Number
    Description: Aurora PostgreSQL port.

  DatabaseName:
    Type: String
    Description: Aurora PostgreSQL database name.

  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN containing database credentials.
  
  StackSuffix:
    Type: String

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for VPC-attached Lambda functions.

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for VPC-attached Lambda functions.

  MeFunctionCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the MeFunction deployment package.

  MeFunctionCodeS3Key:
    Type: String
    Description: S3 key for the MeFunction deployment package.

Resources:
  MeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${StackSuffix}-api-me-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: LambdaVpcNetworking
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn

  MeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${StackSuffix}-api-me"
      Runtime: python3.12
      Handler: nrt_backend.lambdas.me.handler.handler
      Timeout: 10
      Role: !GetAtt MeFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseEndpoint
          DB_PORT: !Ref DatabasePort
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !Ref DatabaseSecretArn
      Code:
        S3Bucket: !Ref MeFunctionCodeS3Bucket
        S3Key: !Ref MeFunctionCodeS3Key

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${StackSuffix}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - OPTIONS
        AllowOrigins:
          - !Ref CorsAllowedOrigin

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      Name: !Sub "${ProjectName}-${StackSuffix}-api-cognito-jwt"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClientId
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"

  MeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt MeFunction.Arn
      PayloadFormatVersion: '2.0'

  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /me
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - aws.cognito.signin.user.admin
      Target: !Sub "integrations/${MeIntegration}"

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  MeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/me"

Outputs:
  ApiEndpoint:
    Description: Base URL for the authenticated HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint

  MeEndpoint:
    Description: Authenticated endpoint that returns selected JWT claims.
    Value: !Sub "${HttpApi.ApiEndpoint}/me"
